spec:
  name: do-lifecycle-scheduler
  services:
  - name: web
    github:
      branch: main
      deploy_on_push: true
    build_command: npm ci && npm run build
    run_command: npm start
    environment_slug: node-js
    instance_size_slug: basic-xxs
    instance_count: 1
    http_port: 8080
    envs:
    - key: NODE_ENV
      scope: RUN_AND_BUILD_TIME
      value: production
    - key: DATABASE_URL
      scope: RUN_AND_BUILD_TIME
      value: ${db.DATABASE_URL}
    - key: DATA_DIR
      scope: RUN_TIME
      value: /workspace/data
  databases:
  - name: db
    engine: PG
    production: false
    version: "16"
